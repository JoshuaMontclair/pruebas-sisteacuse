name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npx tsc -p .

      - name: Pruebas unitarias con cobertura (F1, F2, F3)
        run: npm run test:cobertura

      - name: Criterio S3 · cobertura de las funciones en alcance de F3
        run: npm run cobertura:f3

      - name: Criterio S5 · pruebas de mutación (Stryker)
        run: npm run test:mutacion

      - name: Navegadores de Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Pruebas E2E (F3 en la interfaz, F4)
        run: npm run test:e2e

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: reportes/
          retention-days: 30
